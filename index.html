<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Nexbridge Connect — enterprise SMS messaging platform by Nexbridge Technology." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Nexbridge Connect</title>
    <script>window.__BOOT_T = Date.now();</script>
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #fdfbf8;
        transition: opacity .45s ease, visibility .45s ease;
        font-family: "Baloo 2", ui-sans-serif, system-ui, sans-serif;
      }
      #boot.boot-hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #boot .mark { animation: bootPulse 2.4s ease-in-out infinite; }
      #boot .arc { stroke-dasharray: 5 7; animation: bootFlow 1.3s linear infinite; }
      #boot .arc2 { animation-delay: .35s; }
      #boot .src { animation: bootNode 2.4s ease-in-out infinite; transform-origin: 15px 24px; }
      #boot .word { font-size: 20px; font-weight: 700; letter-spacing: -.01em; color: #241f26; }
      #boot .word b { color: #b8431f; font-weight: 700; }
      #boot .sub { margin-top: -14px; font-size: 11px; font-weight: 500; letter-spacing: .04em; color: #8a7f88;
        font-family: "Hanken Grotesk", system-ui, sans-serif; }
      #boot .bar { position: relative; width: 168px; height: 3px; border-radius: 3px; overflow: hidden; background: #efe3d7; }
      #boot .bar i { position: absolute; top: 0; height: 100%; width: 42%; border-radius: 3px;
        background: linear-gradient(90deg, #ffb59a, #ef6a43); animation: bootBar 1.25s cubic-bezier(.65,.1,.35,.9) infinite; }
      @keyframes bootPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes bootNode { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: .75; } }
      @keyframes bootFlow { to { stroke-dashoffset: -48; } }
      @keyframes bootBar { 0% { left: -45%; } 100% { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        #boot .mark, #boot .arc, #boot .src, #boot .bar i { animation: none; }
        #boot .bar i { left: 0; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Nexbridge Connect">
      <svg class="mark" width="76" height="76" viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="13" fill="#ef6a43" />
        <path class="arc" d="M15 24 C26 24 30 15 40 13" fill="none" stroke="#ffd8c4" stroke-width="3" stroke-linecap="round" />
        <path class="arc arc2" d="M15 24 C26 24 30 33 40 35" fill="none" stroke="#ffe4d0" stroke-width="3" stroke-linecap="round" />
        <circle cx="40" cy="13" r="2.6" fill="#fff" />
        <circle cx="40" cy="35" r="2.6" fill="#fff" />
        <circle class="src" cx="15" cy="24" r="4.4" fill="#fff" />
      </svg>
      <div style="text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center;">
        <div class="word">Nexbridge <b>Connect</b></div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
